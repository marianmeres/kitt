<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>@marianmeres/kitt — examples</title>

		<!--
			Styling = the @marianmeres/design-tokens approach: theme.css holds the
			semantic --app-color-* custom properties (light on :root, dark on
			:root.dark), generated from example/src/theme.ts. Everything below
			styles against those tokens — no hard-coded colors.
			Regenerate with:  deno task example:theme
		-->
		<link rel="stylesheet" href="./theme.css" />
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 2rem clamp(1rem, 4vw, 3rem);
				background: var(--app-color-background);
				color: var(--app-color-foreground);
				font-family:
					ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
					"Liberation Mono", "Courier New", monospace;
				font-size: 15px;
				line-height: 1.5;
			}
			a {
				color: var(--app-color-foreground);
			}
			.head {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: 1rem;
			}
			h1 {
				font-size: 1.25rem;
				font-weight: 500;
				margin: 0 0 0.25rem 0;
			}
			h1 small {
				color: var(--app-color-muted-foreground);
				font-weight: 400;
				font-size: 0.85rem;
			}
			.intro {
				color: var(--app-color-muted-foreground);
				margin: 0 0 2rem 0;
				max-width: 68ch;
			}
			code {
				background: var(--app-color-muted);
				color: var(--app-color-foreground);
				padding: 0.05em 0.35em;
				border-radius: 3px;
				font-size: 0.85em;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
				gap: 1.25rem;
			}
			.demo {
				background: var(--app-color-surface);
				color: var(--app-color-surface-foreground);
				border: 1px solid var(--app-color-border);
				border-radius: 8px;
				padding: 1.25rem;
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
			}
			.demo h2 {
				font-size: 0.9rem;
				font-weight: 500;
				margin: 0;
			}
			.demo .hint {
				color: var(--app-color-muted-foreground);
				font-size: 0.8rem;
				margin: 0;
			}
			.stage {
				min-height: 80px;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1rem;
				background: var(--app-color-background);
				border: 1px solid var(--app-color-border);
				border-radius: 4px;
				overflow: hidden;
			}
			.controls {
				display: flex;
				gap: 0.5rem;
				flex-wrap: wrap;
				align-items: center;
			}
			button {
				background: transparent;
				color: var(--app-color-foreground);
				border: 1px solid var(--app-color-border);
				border-radius: 4px;
				padding: 0.35rem 0.75rem;
				font-family: inherit;
				font-size: 0.8rem;
				cursor: pointer;
				transition:
					border-color 0.15s,
					color 0.15s;
			}
			button:hover {
				border-color: var(--app-color-primary);
				color: var(--app-color-primary);
			}
			.readout {
				color: var(--app-color-muted-foreground);
				font-size: 0.8rem;
			}

			/* --- animated stage elements (off-state colors come from tokens) --- */

			/* 1 & 6) text spans */
			.word {
				font-size: 2.5rem;
				font-weight: 700;
				letter-spacing: 0.05em;
				color: var(--app-color-border); /* "off" letters */
			}
			.word span {
				display: inline-block;
				color: inherit;
			}

			/* 2) svg fill — base fill is currentColor */
			.logo {
				width: 100%;
				max-width: 300px;
				color: var(--app-color-border);
			}

			/* 7) svg opacity — base fill is primary, opacity animates */
			.wave {
				width: 100%;
				max-width: 300px;
			}
			.wave circle {
				fill: var(--app-color-primary);
				opacity: 0.1;
			}

			/* 3) boxes — backgroundColor track */
			.boxes {
				display: flex;
				gap: 6px;
			}
			.boxes .cell {
				width: 26px;
				height: 26px;
				border-radius: 3px;
				background: var(--app-color-muted);
			}

			/* 4) opacity dots */
			.dots {
				display: flex;
				gap: 10px;
			}
			.dots .dot {
				width: 14px;
				height: 14px;
				border-radius: 50%;
				background: var(--app-color-primary);
				opacity: 0.1;
			}

			/* 5) equalizer bars — backgroundColor track */
			.bars {
				display: flex;
				gap: 4px;
				align-items: flex-end;
				height: 60px;
			}
			.bars .bar {
				width: 8px;
				height: 60px;
				background: var(--app-color-muted);
				border-radius: 2px;
			}
		</style>
	</head>
	<body>
		<div class="head">
			<div>
				<h1>
					<a href="https://github.com/marianmeres/kitt"
						>@marianmeres/kitt </a
					><small>— Knight Rider scanner, generalized</small>
				</h1>
				<p class="intro">
					A tiny factory that animates a bright head with a trailing
					gradient across any set of DOM elements. Built in the
					<a href="https://jsr.io/@marianmeres/vanilla"
						>@marianmeres/vanilla</a
					>
					idiom and themed with
					<a href="https://jsr.io/@marianmeres/design-tokens"
						>@marianmeres/design-tokens</a
					>.
				</p>
			</div>
			<button id="theme-toggle">theme</button>
		</div>

		<!-- App mount point. main.ts builds the grid and appends it here. -->
		<div id="app"></div>

		<!-- ===================== TEMPLATES (HTML lives in HTML) ===================== -->

		<template id="tpl-grid">
			<div class="grid"></div>
		</template>

		<!-- One reusable card. data-ref = slots/holes; data-on = delegated actions. -->
		<template id="tpl-card">
			<div class="demo">
				<h2 data-ref="title"></h2>
				<p class="hint" data-ref="hint"></p>
				<div class="stage" data-ref="stage"></div>
				<div class="controls" data-ref="controls">
					<button data-on="click:play">Play</button>
					<button data-on="click:stop">Stop</button>
				</div>
				<div class="controls">
					<span class="readout" data-ref="readout">head: —</span>
				</div>
			</div>
		</template>

		<!-- Per-demo stage content: the actual elements each scanner animates. -->
		<template id="tpl-stage-knight">
			<div class="word">
				<span>K</span><span>N</span><span>I</span><span>G</span><span
					>H</span
				><span>T</span>&nbsp;<span>R</span><span>I</span><span>D</span
				><span>E</span><span>R</span>
			</div>
		</template>

		<template id="tpl-stage-logo">
			<svg class="logo" viewBox="0 0 144 40" fill="currentColor">
				<rect x="0" y="10" width="18" height="20" rx="2" />
				<rect x="24" y="10" width="18" height="20" rx="2" />
				<rect x="48" y="10" width="18" height="20" rx="2" />
				<rect x="72" y="10" width="18" height="20" rx="2" />
				<rect x="96" y="10" width="18" height="20" rx="2" />
				<rect x="120" y="10" width="18" height="20" rx="2" />
			</svg>
		</template>

		<template id="tpl-stage-boxes">
			<div class="boxes">
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
			</div>
		</template>

		<template id="tpl-stage-dots">
			<div class="dots">
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
			</div>
		</template>

		<template id="tpl-stage-bars">
			<div class="bars">
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
				<div class="bar"></div>
			</div>
		</template>

		<template id="tpl-stage-wave">
			<svg class="wave" viewBox="0 0 200 40">
				<circle cx="10" cy="20" r="5" />
				<circle cx="30" cy="20" r="5" />
				<circle cx="50" cy="20" r="5" />
				<circle cx="70" cy="20" r="5" />
				<circle cx="90" cy="20" r="5" />
				<circle cx="110" cy="20" r="5" />
				<circle cx="130" cy="20" r="5" />
				<circle cx="150" cy="20" r="5" />
				<circle cx="170" cy="20" r="5" />
				<circle cx="190" cy="20" r="5" />
			</svg>
		</template>

		<template id="tpl-stage-click">
			<div class="word" style="cursor: pointer">
				<span>C</span><span>L</span><span>I</span><span>C</span><span
					>K</span
				>&nbsp;<span>M</span><span>E</span>
			</div>
		</template>

		<!--
			App logic, bundled from example/src/main.ts (imports kitt + vanilla).
			Build it with:  deno task example:build   (or example:watch)
		-->
		<script type="module" src="./dist/bundle.js"></script>
	</body>
</html>
